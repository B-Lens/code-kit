name: Reusable PR Code Review

on:
  pull_request: 
  workflow_call:
    inputs:
      review_prompt:
        description: Repository-specific review policy appended to the base prompt
        required: false
        type: string
        default: Review for concrete correctness, security, and data-integrity defects. Ignore style and pre-existing issues outside the diff.
      codex_version:
        description: Pinned @openai/codex package version
        required: false
        type: string
        default: "0.147.0"
      antigravity_version:
        description: Pinned Google Antigravity CLI release version
        required: false
        type: string
        default: "1.1.13"
      runner:
        description: GitHub-hosted runner label
        required: false
        type: string
        default: ubuntu-24.04
    secrets:
      CODEX_AUTH_JSON:
        description: Complete Codex CLI auth.json content
        required: true
      ANTIGRAVITY_OAUTH_TOKEN:
        description: Complete Antigravity CLI antigravity-oauth-token content
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    name: Codex review
    if: github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    concurrency:
      group: codex-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Initialize Codex home
        run: echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"

      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout review utilities
        uses: actions/checkout@v7
        with:
          repository: ipankaj18/code-kit
          # Keep this immutable SHA aligned with scripts/pr_code_review.py.
          ref: 5288d1a49073d3727bc2020a7dc98ad18c25a8e4
          path: .code-kit-review
          persist-credentials: false
          sparse-checkout: scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Install pinned Codex CLI
        env:
          CODEX_VERSION: ${{ inputs.codex_version || '0.147.0' }}
        run: npm install --global "@openai/codex@$CODEX_VERSION"

      - name: Install Codex authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          umask 077
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          python3 -m json.tool "$CODEX_HOME/auth.json" >/dev/null

      - name: Create review contract
        env:
          REVIEW_PROMPT: ${{ inputs.review_prompt }}
        run: |
          printf '%s\n' "$REVIEW_PROMPT" > "$RUNNER_TEMP/review-policy.md"
          python3 .code-kit-review/scripts/pr_code_review.py create-schema \
            --output "$RUNNER_TEMP/review-schema.json"

      - name: Run strict Codex review
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          {
            printf 'Review this pull request as a strict merge gate. Compare HEAD with base commit `%s`.\n\n' "$BASE_SHA"
            cat "$RUNNER_TEMP/review-policy.md"
            printf '\n\nUse only changed-file line numbers. Report only findings proven by the diff.\n'
            printf 'PASS requires an empty findings array; FAIL requires at least one finding. Return only schema-compliant JSON.\n'
          } | codex exec \
              --sandbox read-only \
              --ephemeral \
              --ignore-user-config \
              --output-schema "$RUNNER_TEMP/review-schema.json" \
              --output-last-message "$RUNNER_TEMP/codex-review.json" \
              - > "$RUNNER_TEMP/codex-run.log" 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and render review
        id: result
        env:
          REVIEW_ENGINE: codex
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          if test "$REVIEW_EXIT_CODE" != "0"; then
            python3 .code-kit-review/scripts/pr_code_review.py report-failure \
              --engine "$REVIEW_ENGINE" \
              --exit-code "$REVIEW_EXIT_CODE" \
              --log-file "$RUNNER_TEMP/codex-run.log" || true
            exit "$REVIEW_EXIT_CODE"
          fi
          python3 .code-kit-review/scripts/pr_code_review.py render \
            --engine "$REVIEW_ENGINE" \
            --input "$RUNNER_TEMP/$REVIEW_ENGINE-review.json" \
            --output "$RUNNER_TEMP/pr-review.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Post review comment
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ runner.temp }}/pr-review.md
          REVIEW_ENGINE: codex
        with:
          script: |
            const fs = require("fs");
            const name = process.env.REVIEW_ENGINE === "codex" ? "Codex" : "Antigravity";
            const marker = `## ${name} pull-request review`;
            const body = fs.readFileSync(process.env.REVIEW_FILE, "utf8");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Enforce review verdict
        env:
          VERDICT: ${{ steps.result.outputs.verdict }}
        run: test "$VERDICT" = "PASS"

      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/codex-review.json
            ${{ runner.temp }}/codex-run.log
            ${{ runner.temp }}/pr-review.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove Codex authentication
        if: always()
        run: rm -f "$CODEX_HOME/auth.json"

  agy:
    name: Antigravity review
    if: github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    concurrency:
      group: agy-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout review utilities
        uses: actions/checkout@v7
        with:
          repository: ipankaj18/code-kit
          # Keep this immutable SHA aligned with scripts/pr_code_review.py.
          ref: 5288d1a49073d3727bc2020a7dc98ad18c25a8e4
          path: .code-kit-review
          persist-credentials: false
          sparse-checkout: scripts

      - name: Install pinned Antigravity CLI
        env:
          ANTIGRAVITY_VERSION: ${{ inputs.antigravity_version || '1.1.13' }}
        run: |
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/antigravity.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/$ANTIGRAVITY_VERSION/agy_cli_linux_$arch.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/antigravity" "$RUNNER_TEMP/agy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Antigravity authentication
        env:
          ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN }}
        run: |
          token_dir="$HOME/.gemini/antigravity-cli"
          token_file="$token_dir/antigravity-oauth-token"
          settings_file="$token_dir/settings.json"
          mkdir -p "$token_dir"
          if test -f "$settings_file"; then
            cp "$settings_file" "$RUNNER_TEMP/antigravity-settings.json"
            touch "$RUNNER_TEMP/antigravity-settings-backed-up"
          else
            touch "$RUNNER_TEMP/antigravity-settings-created"
          fi
          if test -n "$ANTIGRAVITY_OAUTH_TOKEN"; then
            umask 077
            printf '%s' "$ANTIGRAVITY_OAUTH_TOKEN" > "$token_file"
            touch "$RUNNER_TEMP/antigravity-token-installed"
          elif ! test -s "$token_file"; then
            echo "ANTIGRAVITY_OAUTH_TOKEN is unset and $token_file does not exist" >&2
            exit 1
          fi
          python3 .code-kit-review/scripts/pr_code_review.py configure-antigravity \
            --settings-file "$settings_file"

      - name: Create review contract
        env:
          REVIEW_PROMPT: ${{ inputs.review_prompt }}
        run: |
          printf '%s\n' "$REVIEW_PROMPT" > "$RUNNER_TEMP/review-policy.md"
          python3 .code-kit-review/scripts/pr_code_review.py create-schema \
            --output "$RUNNER_TEMP/review-schema.json"

      - name: Run strict Antigravity review
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          context_file="$RUNNER_TEMP/antigravity-review-context.md"
          {
            printf '# Pull-request review instructions\n\n'
            cat "$RUNNER_TEMP/review-policy.md"
            printf '\n\nReview only the patch below. Do not run commands or use network tools.\n'
            printf 'Use only changed-file line numbers. Report only findings proven by the patch.\n'
            printf 'PASS requires an empty findings array; FAIL requires at least one finding.\n\n'
            printf '# Patch\n\n```diff\n'
            git diff --no-ext-diff --find-renames "$BASE_SHA"...HEAD --
            printf '```\n'
          } > "$context_file"
          prompt="$({
            printf 'Review this pull request as a strict merge gate. Read `%s`.\n' "$context_file"
            printf 'That file contains all review instructions and the complete patch.\n'
            printf 'Do not run terminal commands or use network tools. Return only schema-compliant JSON.\n'
          })"
          set +e
          agy --print "$prompt" \
            --mode plan \
            --sandbox \
            --add-dir "$RUNNER_TEMP" \
            --output-format json \
            --json-schema "$RUNNER_TEMP/review-schema.json" \
            --print-timeout 20m \
            > "$RUNNER_TEMP/antigravity-review.json" \
            2> "$RUNNER_TEMP/antigravity-run.log"
          status=$?
          if test "$status" = "0"; then
            python3 .code-kit-review/scripts/pr_code_review.py validate-antigravity-envelope \
              --input "$RUNNER_TEMP/antigravity-review.json" \
              2>> "$RUNNER_TEMP/antigravity-run.log"
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and render review
        id: result
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          if test "$REVIEW_EXIT_CODE" != "0"; then
            python3 .code-kit-review/scripts/pr_code_review.py report-failure \
              --engine antigravity \
              --exit-code "$REVIEW_EXIT_CODE" \
              --log-file "$RUNNER_TEMP/antigravity-run.log" || true
            exit "$REVIEW_EXIT_CODE"
          fi
          python3 .code-kit-review/scripts/pr_code_review.py render \
            --engine antigravity \
            --input "$RUNNER_TEMP/antigravity-review.json" \
            --output "$RUNNER_TEMP/pr-review.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Post review comment
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ runner.temp }}/pr-review.md
        with:
          script: |
            const fs = require("fs");
            const marker = "## Antigravity pull-request review";
            const body = fs.readFileSync(process.env.REVIEW_FILE, "utf8");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Enforce review verdict
        env:
          VERDICT: ${{ steps.result.outputs.verdict }}
        run: test "$VERDICT" = "PASS"

      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agy-review-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/antigravity-review.json
            ${{ runner.temp }}/antigravity-run.log
            ${{ runner.temp }}/pr-review.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove Antigravity authentication
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/antigravity-token-installed"; then
            rm -f "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          fi
          if test -f "$RUNNER_TEMP/antigravity-settings-backed-up"; then
            cp "$RUNNER_TEMP/antigravity-settings.json" "$HOME/.gemini/antigravity-cli/settings.json"
          elif test -f "$RUNNER_TEMP/antigravity-settings-created"; then
            rm -f "$HOME/.gemini/antigravity-cli/settings.json"
          fi
