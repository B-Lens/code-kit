name: Reusable PR Code Review

on:
  workflow_call:
    inputs:
      review_prompt:
        description: Repository-specific review policy appended to the base prompt
        required: false
        type: string
        default: Review for concrete correctness, security, and data-integrity defects. Ignore style and pre-existing issues outside the diff.
      codex_version:
        description: Pinned @openai/codex package version
        required: false
        type: string
        default: "0.147.0"
      antigravity_version:
        description: Pinned Google Antigravity CLI release version
        required: false
        type: string
        default: "1.1.13"
      runner:
        description: GitHub-hosted runner label
        required: false
        type: string
        default: ubuntu-24.04
    secrets:
      CODEX_AUTH_JSON:
        description: Complete Codex CLI auth.json content
        required: true
      ANTIGRAVITY_OAUTH_TOKEN:
        description: Complete Antigravity CLI antigravity-oauth-token content
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    name: Codex review
    uses: ./.github/workflows/pr-review-engine.yml
    with:
      review_engine: codex
      review_prompt: ${{ inputs.review_prompt }}
      codex_version: ${{ inputs.codex_version }}
      antigravity_version: ${{ inputs.antigravity_version }}
      runner: ${{ inputs.runner }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

  antigravity:
    name: Antigravity review
    uses: ./.github/workflows/pr-review-engine.yml
    with:
      review_engine: antigravity
      review_prompt: ${{ inputs.review_prompt }}
      codex_version: ${{ inputs.codex_version }}
      antigravity_version: ${{ inputs.antigravity_version }}
      runner: ${{ inputs.runner }}
    secrets:
      ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN }}
