name: PR Merger

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Squash approved pull request
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pr-automerge-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Verify reviewer and merge
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const reviewer = context.payload.review.user.login;
            const access = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: reviewer,
            });
            const trusted = new Set(["admin", "maintain", "write"]);
            if (!trusted.has(access.data.permission)) {
              core.notice(`Ignoring approval from ${reviewer}: repository permission is ${access.data.permission}.`);
              return;
            }

            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            if (repository.data.allow_auto_merge) {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }`,
                { pullRequestId: pullRequest.node_id },
              );
              core.notice(`Enabled squash auto-merge for pull request #${pullRequest.number}.`);
              return;
            }

            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              merge_method: "squash",
              sha: pullRequest.head.sha,
            });
            if (!result.data.merged) {
              core.setFailed(result.data.message || `Pull request #${pullRequest.number} was not merged.`);
              return;
            }
            core.notice(`Squash-merged pull request #${pullRequest.number}; repository auto-merge is disabled.`);
