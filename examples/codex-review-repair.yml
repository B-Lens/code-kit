name: Codex Review Repair

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    uses: ipankaj18/codex-workflow-kit/.github/workflows/codex-review-repair.yml@v1
    with:
      extra_instructions: Preserve this repository's documented safety boundaries.
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
