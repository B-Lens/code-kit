name: Codex Automation

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  automation:
    uses: ipankaj18/code-kit/.github/workflows/codex-automation.yml@v1
    with:
      reviewer: ipankaj18
      extra_instructions: Preserve this repository's documented safety boundaries.
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
